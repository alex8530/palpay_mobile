# Codemagic (codemagic.io): builds an unsigned iOS .ipa on a Mac. Start it
# from the Codemagic dashboard, download PalPay.ipa from the build's
# artifacts, then sign + install it from Windows with Sideloadly.
workflows:
  ios-unsigned:
    name: iOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Tests
        script: flutter test
      - name: Build (no code signing)
        script: flutter build ios --release --no-codesign
      - name: Package .ipa
        script: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr PalPay.ipa Payload
    artifacts:
      - PalPay.ipa
