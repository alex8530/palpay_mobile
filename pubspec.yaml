name: palpay_mobile
description: Standalone PalPay console (mobile port of the Laravel admin app).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: 3.0.3
  http: 1.2.2
  flutter_secure_storage: 9.2.2
  share_plus: 10.0.2
  path_provider: 2.1.4
  image_picker: 1.1.2
  image: 4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0

flutter:
  uses-material-design: true
